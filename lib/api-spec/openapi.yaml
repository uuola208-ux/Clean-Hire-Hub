openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Cleaning Agency Recruitment API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: applications
    description: Job application management
  - name: documents
    description: Document upload and management
  - name: contact
    description: Contact form submissions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List all applications (admin)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, shortlisted, rejected, hired]
        - name: position
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationList"
    post:
      operationId: createApplication
      tags: [applications]
      summary: Submit a new job application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /applications/stats:
    get:
      operationId: getApplicationStats
      tags: [applications]
      summary: Get application statistics
      responses:
        "200":
          description: Application statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationStats"

  /applications/{id}:
    get:
      operationId: getApplication
      tags: [applications]
      summary: Get a single application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Application details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteApplication
      tags: [applications]
      summary: Delete an application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /applications/{id}/status:
    patch:
      operationId: updateApplicationStatus
      tags: [applications]
      summary: Update application status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationStatusInput"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /applications/{id}/documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List documents for an application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: uploadDocument
      tags: [documents]
      summary: Upload a document for an application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DocumentUploadInput"
      responses:
        "201":
          description: Document uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /contact:
    get:
      operationId: listContactInquiries
      tags: [contact]
      summary: List all contact inquiries (admin)
      responses:
        "200":
          description: List of contact inquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactInquiry"
    post:
      operationId: createContactInquiry
      tags: [contact]
      summary: Submit a contact inquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Inquiry submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactInquiry"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Application:
      type: object
      required:
        - id
        - fullName
        - dateOfBirth
        - address
        - phone
        - email
        - nationality
        - positionApplying
        - availability
        - hasDrivingLicence
        - rightToWorkUk
        - gdprConsent
        - status
        - createdAt
      properties:
        id:
          type: integer
        fullName:
          type: string
        dateOfBirth:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        nationality:
          type: string
        positionApplying:
          type: string
        previousExperience:
          type: ["string", "null"]
        availability:
          type: string
        hasDrivingLicence:
          type: boolean
        rightToWorkUk:
          type: boolean
        niNumber:
          type: ["string", "null"]
        adminNotes:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, shortlisted, rejected, hired]
        createdAt:
          type: string

    ApplicationInput:
      type: object
      required:
        - fullName
        - dateOfBirth
        - address
        - phone
        - email
        - nationality
        - positionApplying
        - availability
        - hasDrivingLicence
        - rightToWorkUk
        - gdprConsent
      properties:
        fullName:
          type: string
          minLength: 2
        dateOfBirth:
          type: string
        address:
          type: string
          minLength: 5
        phone:
          type: string
          minLength: 5
        email:
          type: string
        nationality:
          type: string
        positionApplying:
          type: string
          enum:
            - domestic-cleaner
            - commercial-cleaner
            - office-cleaner
            - housekeeping
            - supervisor
        previousExperience:
          type: string
        availability:
          type: string
        hasDrivingLicence:
          type: boolean
        rightToWorkUk:
          type: boolean
        niNumber:
          type: string
        gdprConsent:
          type: boolean

    ApplicationStatusInput:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [pending, shortlisted, rejected, hired]
        adminNotes:
          type: string

    ApplicationList:
      type: object
      required:
        - applications
        - total
        - page
        - limit
      properties:
        applications:
          type: array
          items:
            $ref: "#/components/schemas/Application"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    ApplicationStats:
      type: object
      required:
        - total
        - byStatus
        - byPosition
        - recentCount
      properties:
        total:
          type: integer
        byStatus:
          type: array
          items:
            $ref: "#/components/schemas/StatCount"
        byPosition:
          type: array
          items:
            $ref: "#/components/schemas/StatCount"
        recentCount:
          type: integer

    StatCount:
      type: object
      required:
        - label
        - count
      properties:
        label:
          type: string
        count:
          type: integer

    Document:
      type: object
      required:
        - id
        - applicationId
        - documentType
        - originalName
        - mimeType
        - fileSize
        - createdAt
      properties:
        id:
          type: integer
        applicationId:
          type: integer
        documentType:
          type: string
        originalName:
          type: string
        mimeType:
          type: string
        fileSize:
          type: integer
        filePath:
          type: ["string", "null"]
        createdAt:
          type: string

    DocumentUploadInput:
      type: object
      required:
        - documentType
      properties:
        documentType:
          type: string
          enum:
            - cv
            - passport-id
            - right-to-work
            - dbs-certificate
            - national-insurance
            - proof-of-address
            - cleaning-certificate
            - other

    ContactInquiry:
      type: object
      required:
        - id
        - name
        - email
        - message
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        subject:
          type: ["string", "null"]
        message:
          type: string
        createdAt:
          type: string

    ContactInput:
      type: object
      required:
        - name
        - email
        - message
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
        phone:
          type: string
        subject:
          type: string
        message:
          type: string
          minLength: 10
